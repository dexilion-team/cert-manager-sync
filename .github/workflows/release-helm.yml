name: Release Helm Chart

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      # appVersion comes from the tag so the chart pulls the image that
      # release-image.yml pushes for this same tag (v1.6.1-dexilion -> 1.6.1-dexilion)
      - name: Package chart
        run: helm package deploy/cert-manager-sync --app-version "${GITHUB_REF_NAME#v}" --destination dist

      # Attach the packaged chart to the tag's GitHub release. There is no
      # gh-pages chart repo index; consumers install the .tgz directly.
      - name: Upload chart to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
